services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ringwatch
      POSTGRES_PASSWORD: ringwatch
      POSTGRES_DB: ringwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ringwatch:ringwatch@postgres:5432/ringwatch
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3001,http://localhost:3000
      MODEL_DIR: /app/ml/model
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - ./ml:/app/ml:ro
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_PUBLIC_WS_URL: ws://localhost:8001
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
    depends_on:
      - backend

volumes:
  pgdata:
